name: Build App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 編譯 Android App 容器
        run: |
          echo "準備將網頁封裝為獨立 App..."
          mkdir -p app-build
          cp index.html app-build/
          
      - name: 建立 Android 封裝結構
        uses: Onunok/html-to-apk-action@v1
        with:
          html-file: 'index.html'
          app-name: '我的質感記帳'
          package-name: 'com.myexpense.app'
