name: Generate WebAPK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 產生專屬 Web App 資訊
        run: |
          echo "正在驗證 index.html..."
          if [ -f "index.html" ]; then
            echo "index.html 存在，準備封裝..."
          else
            echo "找不到 index.html!" && exit 1
          fi
          
      - name: 上傳打包資產
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-app-web
          path: index.html
