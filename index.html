<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質感記帳 App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #f39c12;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --credit-color: #3498db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 60px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2, h3 {
            color: var(--accent-color);
            margin-top: 0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .submit-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .submit-btn:active {
            opacity: 0.8;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        /* 計算機彈窗樣式 */
        .calc-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .calc-box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
            border: 1px solid #444;
        }
        .calc-display {
            background-color: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 1.6rem;
            text-align: right;
            letter-spacing: 1px;
            min-height: 30px;
            word-break: break-all;
        }
        .calc-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .calc-btn:active {
            background-color: #555;
        }
        .calc-btn.operator {
            background-color: #d35400;
        }
        .calc-btn.equals {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
        }
        .calc-btn.clear {
            background-color: var(--danger-color);
        }
        .calc-btn.confirm {
            background-color: var(--success-color);
            grid-column: span 4;
            margin-top: 5px;
            font-weight: bold;
        }
        .transaction-item {
            background-color: #2a2a2a;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .expense { color: var(--danger-color); }
        .income { color: var(--success-color); }
        .credit-tag { color: var(--credit-color); font-size: 0.85rem; margin-left: 5px; }
        .delete-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchPage('home', this)">首頁</button>
        <button class="nav-tab" onclick="switchPage('add', this)">記一筆</button>
        <button class="nav-tab" onclick="switchPage('accounts', this)">帳戶</button>
        <button class="nav-tab" onclick="switchPage('categories', this)">分類</button>
        <button class="nav-tab" onclick="switchPage('charts', this)">圖表</button>
    </div>

    <!-- 首頁 -->
    <div id="home" class="page active">
        <div class="card">
            <h2>📊 本週預算控制台</h2>
            <p>本週已花費總額：<span id="weeklySpent">$0</span></p>
            <p>本週預算剩餘：<span id="weeklyBudgetRemain">$3000</span></p>
            <p>今日已花費：<span id="todaySpent">$0</span></p>
            <input type="number" id="budgetInput" value="3000" placeholder="設定預算">
            <button class="submit-btn" onclick="updateBudget()">修改預算</button>
        </div>

        <div class="card">
            <h3>💰 帳戶資產總覽</h3>
            <p>現金錢包 : <span id="accCash">$1000</span></p>
            <p>中國信託 (活存) : <span id="accCTBC">$5000</span></p>
            <p>國泰世華 (活存) : <span id="accCathay">$10000</span></p>
            <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">
            <p style="color: var(--credit-color);">信用卡待繳負債：<span id="creditDebt">$0</span></p>
            <p><strong>淨資產合計：<span id="totalAssets">$16000</span></strong></p>
        </div>

        <div class="card">
            <h3>📝 近期記帳明細</h3>
            <ul id="transactionList" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>

    <!-- 記一筆頁面 -->
    <div id="add" class="page">
        <div class="card">
            <h2>✍️ 新增記帳</h2>
            <input type="text" id="title" placeholder="項目名稱 (例如: 午餐)">
            
            <input type="text" id="amountDisplay" placeholder="點擊輸入金額 (可加減)" readonly onclick="openCalc()">
            
            <select id="type">
                <option value="expense">支出 (-)</option>
                <option value="income">收入 (+)</option>
            </select>

            <label style="font-size: 0.9rem; color: #aaa; margin-top: 8px; display: block;">付款帳戶 / 方式：</label>
            <select id="accountSource">
                <option value="cash">現金錢包</option>
                <option value="ctbc">中國信託 (活存)</option>
                <option value="cathay">國泰世華 (活存)</option>
                <option value="credit">信用卡 (不扣現金，計入負債)</option>
            </select>

            <button class="submit-btn" onclick="addTransaction()">確認新增</button>
        </div>
    </div>

    <!-- 帳戶頁面 -->
    <div id="accounts" class="page">
        <div class="card">
            <h2>💳 帳戶與繳卡費管理</h2>
            <p>當收到帳單要繳卡費時，可在此執行扣款：</p>
            <select id="payCreditAccount">
                <option value="ctbc">從 中國信託 繳納信用卡</option>
                <option value="cathay">從 國泰世華 繳納信用卡</option>
            </select>
            <button class="submit-btn" style="background-color: var(--credit-color); margin-top: 15px;" onclick="payCreditCard()">繳交全部信用卡費</button>
        </div>
    </div>

    <div id="categories" class="page">
        <div class="card"><h2>🏷️ 消費分類</h2><p>餐飲、交通、娛樂等管理。</p></div>
    </div>
    <div id="charts" class="page">
        <div class="card"><h2>📈 收支圖表分析</h2><p>分析圖表建置中。</p></div>
    </div>
</div>

<!-- 計算機彈窗 -->
<div id="calcModal" class="calc-modal">
    <div class="calc-box">
        <div id="calcScreen" class="calc-display">0</div>
        <div class="calc-keypad">
            <button class="calc-btn clear" onclick="calcClear()">C</button>
            <button class="calc-btn" onclick="calcAppend('7')">7</button>
            <button class="calc-btn" onclick="calcAppend('8')">8</button>
            <button class="calc-btn" onclick="calcAppend('9')">9</button>
            <button class="calc-btn operator" onclick="calcAppend('+')">+</button>
            <button class="calc-btn" onclick="calcAppend('4')">4</button>
            <button class="calc-btn" onclick="calcAppend('5')">5</button>
            <button class="calc-btn" onclick="calcAppend('6')">6</button>
            <button class="calc-btn operator" onclick="calcAppend('-')">-</button>
            <button class="calc-btn" onclick="calcAppend('1')">1</button>
            <button class="calc-btn" onclick="calcAppend('2')">2</button>
            <button class="calc-btn" onclick="calcAppend('3')">3</button>
            <button class="calc-btn equals" onclick="calcResult()">=</button>
            <button class="calc-btn" onclick="calcAppend('0')">0</button>
            <button class="calc-btn" onclick="calcAppend('.')">.</button>
            <button class="calc-btn" onclick="calcBackSpace()">⌫</button>
            <button class="calc-btn confirm" onclick="calcConfirm()">確定金額</button>
        </div>
    </div>
</div>

<script>
    function switchPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    let currentExpression = "0";
    let finalAmount = 0;

    function openCalc() {
        document.getElementById('calcModal').style.display = 'flex';
        currentExpression = "0";
        updateCalcScreen();
    }
    function updateCalcScreen() { document.getElementById('calcScreen').innerText = currentExpression; }
    function calcAppend(val) {
        if (currentExpression === "0" && val !== '.') currentExpression = val;
        else currentExpression += val;
        updateCalcScreen();
    }
    function calcClear() { currentExpression = "0"; updateCalcScreen(); }
    function calcBackSpace() {
        currentExpression = currentExpression.length > 1 ? currentExpression.slice(0, -1) : "0";
        updateCalcScreen();
    }
    function calcResult() {
        try {
            let res = eval(currentExpression);
            currentExpression = (isNaN(res) || !isFinite(res)) ? "錯誤" : String(res);
        } catch { currentExpression = "錯誤"; }
        updateCalcScreen();
    }
    function calcConfirm() {
        calcResult();
        if (currentExpression !== "錯誤") {
            finalAmount = parseFloat(currentExpression);
            document.getElementById('amountDisplay').value = finalAmount;
            document.getElementById('calcModal').style.display = 'none';
        } else { alert('算式有誤！'); }
    }

    // 資料與狀態管理
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let weeklyBudget = localStorage.getItem('weeklyBudget') ? parseFloat(localStorage.getItem('weeklyBudget')) : 3000;
    
    // 各帳戶初始值
    let accounts = JSON.parse(localStorage.getItem('accounts')) || {
        cash: 1000,
        ctbc: 5000,
        cathay: 10000,
        creditDebt: 0 // 信用卡待繳負債
    };

    function updateBudget() {
        let val = parseFloat(document.getElementById('budgetInput').value);
        if (!isNaN(val) && val >= 0) {
            weeklyBudget = val;
            localStorage.setItem('weeklyBudget', weeklyBudget);
            renderAll();
            alert('預算已更新！');
        } else { alert('請輸入有效預算！'); }
    }

    function addTransaction() {
        let title = document.getElementById('title').value.trim();
        let type = document.getElementById('type').value;
        let source = document.getElementById('accountSource').value;

        if (!title || isNaN(finalAmount) || finalAmount <= 0) {
            alert('請輸入有效的項目與金額！');
            return;
        }

        // 根據付款方式扣款或增加負債
        if (type === 'expense') {
            if (source === 'cash') accounts.cash -= finalAmount;
            else if (source === 'ctbc') accounts.ctbc -= finalAmount;
            else if (source === 'cathay') accounts.cathay -= finalAmount;
            else if (source === 'credit') {
                accounts.creditDebt += finalAmount; // 刷信用卡：增加負債，不扣現金！
            }
        } else {
            // 收入預設加到中信活存
            accounts.ctbc += finalAmount;
        }

        const transaction = {
            id: Date.now(),
            title: title,
            amount: finalAmount,
            type: type,
            source: source
        };

        transactions.push(transaction);
        renderAll();

        document.getElementById('title').value = '';
        document.getElementById('amountDisplay').value = '';
        finalAmount = 0;
        
        switchPage('home', document.querySelectorAll('.nav-tab')[0]);
    }

    function payCreditCard() {
        let bank = document.getElementById('payCreditAccount').value;
        let debt = accounts.creditDebt;

        if (debt <= 0) {
            alert('目前沒有需要繳納的信用卡負債！');
            return;
        }

        if (bank === 'ctbc') {
            if (accounts.ctbc < debt) { alert('中國信託餘額不足！'); return; }
            accounts.ctbc -= debt;
        } else {
            if (accounts.cathay < debt) { alert('國泰世華餘額不足！'); return; }
            accounts.cathay -= debt;
        }

        // 紀錄繳卡費這筆動作
        transactions.push({
            id: Date.now(),
            title: '繳交信用卡費',
            amount: debt,
            type: 'expense',
            source: bank + '_pay'
        });

        accounts.creditDebt = 0; // 負債歸零
        renderAll();
        alert('信用卡費已成功繳納！現金資產已扣款，負債已歸零。');
    }

    function deleteTransaction(id) {
        let tIndex = transactions.findIndex(t => t.id === id);
        if (tIndex !== -1) {
            let t = transactions[tIndex];
            // 刪除時把金額反向加扣回來（簡易還原邏輯）
            if (t.type === 'expense') {
                if (t.source === 'cash') accounts.cash += t.amount;
                else if (t.source === 'ctbc') accounts.ctbc += t.amount;
                else if (t.source === 'cathay') accounts.cathay += t.amount;
                else if (t.source === 'credit') accounts.creditDebt -= t.amount;
            }
            transactions.splice(tIndex, 1);
            renderAll();
        }
    }

    function renderAll() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
        localStorage.setItem('accounts', JSON.stringify(accounts));
        
        let totalSpentWeek = 0;
        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = '';

        transactions.slice().reverse().forEach(t => {
            if (t.type === 'expense' && t.source !== 'ctbc_pay' && t.source !== 'cathay_pay') {
                totalSpentWeek += t.amount;
            }

            let sourceText = '';
            if (t.source === 'cash') sourceText = '<span class="credit-tag">[現金]</span>';
            else if (t.source === 'ctbc') sourceText = '<span class="credit-tag">[中信]</span>';
            else if (t.source === 'cathay') sourceText = '<span class="credit-tag">[國泰]</span>';
            else if (t.source === 'credit') sourceText = '<span class="credit-tag" style="color:var(--credit-color)">[信用卡]</span>';

            const li = document.createElement('li');
            li.className = 'transaction-item';
            li.innerHTML = `
                <span>${t.title} ${sourceText}</span>
                <span class="${t.type}">
                    ${t.type === 'expense' ? '-' : '+'}$${t.amount}
                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">×</button>
                </span>
            `;
            listEl.appendChild(li);
        });

        // 更新首頁數字
        document.getElementById('weeklySpent').innerText = '$' + totalSpentWeek;
        document.getElementById('weeklyBudgetRemain').innerText = '$' + (weeklyBudget - totalSpentWeek);
        document.getElementById('budgetInput').value = weeklyBudget;

        document.getElementById('accCash').innerText = '$' + accounts.cash;
        document.getElementById('accCTBC').innerText = '$' + accounts.ctbc;
        document.getElementById('accCathay').innerText = '$' + accounts.cathay;
        document.getElementById('creditDebt').innerText = '$' + accounts.creditDebt;

        // 淨資產 = 現金總和 - 信用卡負債
        let netAssets = accounts.cash + accounts.ctbc + accounts.cathay - accounts.creditDebt;
        document.getElementById('totalAssets').innerText = '$' + netAssets;
    }

    renderAll();
</script>

</body>
</html>
