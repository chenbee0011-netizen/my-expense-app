<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的質感記帳 App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2c2c2c;
            --text-main: #e0e0e0;
            --text-sub: #888888;
            --accent-gold: #f39c12;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: var(--text-main); }
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        
        /* 頁籤選單 */
        .tabs { display: flex; justify-content: space-around; background: var(--card-bg); border-radius: 12px; padding: 10px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .tab-btn { background: none; border: none; color: var(--text-sub); font-size: 1rem; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 8px; }
        .tab-btn.active { background: var(--accent-gold); color: #000; }

        .section { display: none; }
        .section.active { display: block; }

        h2 { font-size: 1.1rem; border-left: 4px solid var(--accent-gold); padding-left: 8px; margin-top: 20px; color: var(--text-main); }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 16px; border-radius: 12px; margin-bottom: 15px; line-height: 1.6; }
        
        label { display: block; margin-top: 12px; font-size: 0.9rem; font-weight: bold; color: var(--text-sub); }
        input, select { width: 100%; padding: 12px; margin-top: 6px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 1rem; color: #fff; }
        
        .type-selector { display: flex; gap: 10px; margin-top: 5px; }
        .type-btn { flex: 1; padding: 10px; border: 1px solid #444; background: #2a2a2a; color: var(--text-sub); border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
        .type-btn.active.expense { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
        .type-btn.active.income { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        .type-btn.active.transfer { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        button.submit-btn { background: var(--accent-gold); color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button.submit-btn:active { opacity: 0.8; }

        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--card-border); font-size: 0.95rem; }
        .record-info div:last-child { font-size: 0.8rem; color: var(--text-sub); margin-top: 3px; }
        .record-amount { font-weight: bold; }
        .amount-expense { color: var(--accent-red); }
        .amount-income { color: var(--accent-green); }
        .amount-transfer { color: var(--accent-blue); }

        .del-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 0.9rem; padding: 5px; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部頁籤 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁總覽</button>
        <button class="tab-btn" onclick="switchTab('add')">記一筆</button>
        <button class="tab-btn" onclick="switchTab('accounts')">帳戶管理</button>
    </div>

    <!-- 1. 首頁與預算控制台 -->
    <div id="home" class="section active">
        <h2>📊 本週預算控制台</h2>
        <div class="card" id="budgetCard">載入中...</div>

        <h2>💰 帳戶資產總覽</h2>
        <div class="card" id="accountSummaryCard">載入中...</div>

        <h2>📝 近期記帳明細</h2>
        <div class="card" id="recordListCard">載入中...</div>
    </div>

    <!-- 2. 記帳輸入頁面 -->
    <div id="add" class="section">
        <h2>✍️ 新增收支 / 轉帳</h2>
        <div class="card">
            <label>記帳類型：</label>
            <div class="type-selector">
                <div class="type-btn active expense" onclick="setType('支出')">支出</div>
                <div class="type-btn income" onclick="setType('收入')">收入</div>
                <div class="type-btn transfer" onclick="setType('轉帳')">轉帳</div>
            </div>

            <label>日期：</label>
            <input type="date" id="date">

            <div id="normalCategoryGroup">
                <label>一級分類：</label>
                <select id="primaryCategory">
                    <option value="餐飲">餐飲</option>
                    <option value="交通">交通</option>
                    <option value="生活">生活</option>
                    <option value="購物">購物</option>
                    <option value="娛樂">娛樂</option>
                    <option value="儲蓄">儲蓄</option>
                </select>

                <label>二級消費細項：</label>
                <input type="text" id="subCategory" placeholder="例如：早餐、午餐、咖啡、手搖飲">
            </div>

            <div id="transferGroup" style="display:none;">
                <label>轉出帳戶：</label>
                <select id="fromAccount"></select>

                <label>轉入帳戶：</label>
                <select id="toAccount"></select>
            </div>

            <div id="accountGroup">
                <label>支付/收支帳戶：</label>
                <select id="account"></select>
            </div>

            <label>金額 (NT$)：</label>
            <input type="number" id="amount" placeholder="請輸入金額">

            <label>備註說明：</label>
            <input type="text" id="note" placeholder="例如：雞腿飯、跟朋友聚餐">

            <button class="submit-btn" onclick="addRecord()">確認儲存</button>
        </div>
    </div>

    <!-- 3. 帳戶管理頁面 (可自由新增) -->
    <div id="accounts" class="section">
        <h2>💳 自訂支付帳戶</h2>
        <div class="card">
            <label>新增帳戶名稱：</label>
            <div class="flex-row">
                <input type="text" id="newAccountName" placeholder="例如：LinePay、玉山銀行">
                <button onclick="addAccount()" style="width: 100px; background: var(--accent-gold); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">新增</button>
            </div>
        </div>
        <h2>現有帳戶列表</h2>
        <div class="card" id="accountListCard">載入中...</div>
    </div>
</div>

<script>
    // 資料初始化
    let records = JSON.parse(localStorage.getItem('app_records')) || [];
    let accounts = JSON.parse(localStorage.getItem('app_accounts')) || ["現金錢包", "中國信託", "國泰世華"];
    let weeklyBudget = Number(localStorage.getItem('app_weekly_budget')) || 3000;
    let currentType = "支出";

    document.getElementById('date').valueAsDate = new Date();

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        render();
    }

    function setType(type) {
        currentType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active', 'expense', 'income', 'transfer'));
        const btn = event.target;
        btn.classList.add('active', type === '支出' ? 'expense' : type === '收入' ? 'income' : 'transfer');

        if (type === '轉帳') {
            document.getElementById('normalCategoryGroup').style.display = 'none';
            document.getElementById('accountGroup').style.display = 'none';
            document.getElementById('transferGroup').style.display = 'block';
        } else {
            document.getElementById('normalCategoryGroup').style.display = 'block';
            document.getElementById('accountGroup').style.display = 'block';
            document.getElementById('transferGroup').style.display = 'none';
        }
    }

    function addAccount() {
        const name = document.getElementById('newAccountName').value.trim();
        if (name && !accounts.includes(name)) {
            accounts.push(name);
            localStorage.setItem('app_accounts', JSON.stringify(accounts));
            document.getElementById('newAccountName').value = '';
            render();
            alert('帳戶新增成功！');
        } else {
            alert('請輸入有效或未重複的帳戶名稱。');
        }
    }

    function deleteAccount(name) {
        if (accounts.length <= 1) {
            alert('至少需要保留一個帳戶！');
            return;
        }
        accounts = accounts.filter(a => a !== name);
        localStorage.setItem('app_accounts', JSON.stringify(accounts));
        render();
    }

    function addRecord() {
        const date = document.getElementById('date').value;
        const amount = Number(document.getElementById('amount').value);
        const note = document.getElementById('note').value;

        if (!date || !amount) {
            alert('請完整填寫日期與金額！');
            return;
        }

        let newRecord = { id: Date.now(), type: currentType, date, amount, note };

        if (currentType === '轉帳') {
            newRecord.from = document.getElementById('fromAccount').value;
            newRecord.to = document.getElementById('toAccount').value;
            if (newRecord.from === newRecord.to) {
                alert('轉出與轉入帳戶不能相同！');
                return;
            }
        } else {
            newRecord.primary = document.getElementById('primaryCategory').value;
            newRecord.sub = document.getElementById('subCategory').value || '一般';
            newRecord.account = document.getElementById('account').value;
        }

        records.push(newRecord);
        localStorage.setItem('app_records', JSON.stringify(records));
        
        // 重置表單並回首頁
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        document.getElementById('subCategory').value = '';
        switchTab('home');
        document.querySelector('.tabs button').classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.remove('active');
    }

    function deleteRecord(id) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('app_records', JSON.stringify(records));
        render();
    }

    function render() {
        // 更新下拉選單
        const accSelects = ['account', 'fromAccount', 'toAccount'];
        accSelects.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = accounts.map(acc => `<option value="${acc}">${acc}</option>`).join('');
            }
        });

        // 計算各帳戶餘額
        let balances = {};
        accounts.forEach(acc => balances[acc] = 0);

        let totalExpense = 0;
        let todayExpense = 0;
        const todayStr = new Date().toISOString().split('T')[0];

        // 計算本週一
        const now = new Date();
        const dayOfWeek = now.getDay() || 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - dayOfWeek + 1);
        const mondayStr = monday.toISOString().split('T')[0];

        records.sort((a, b) => new Date(b.date) - new Date(a.date));

        records.forEach(r => {
            if (r.type === '收入') {
                if (balances[r.account] !== undefined) balances[r.account] += r.amount;
            } else if (r.type === '支出') {
                if (balances[r.account] !== undefined) balances[r.account] -= r.amount;
                if (r.date === todayStr) todayExpense += r.amount;
                if (r.date >= mondayStr) totalExpense += r.amount;
            } else if (r.type === '轉帳') {
                if (balances[r.from] !== undefined) balances[r.from] -= r.amount;
                if (balances[r.to] !== undefined) balances[r.to] += r.amount;
            }
        });

        // 渲染預算控制台
        let remaining = weeklyBudget - totalExpense;
        document.getElementById('budgetCard').innerHTML = `
            本週總預算上限：$${weeklyBudget}<br>
            本週已花費總額：$${totalExpense}<br>
            <b>本週預算剩餘：$${remaining}</b><br>
            今日已花費：$${todayExpense}
        `;

        // 渲染帳戶資產總覽
        let totalAsset = 0;
        let accHtml = '';
        for (let acc in balances) {
            totalAsset += balances[acc];
            accHtml += `${acc}：$${balances[acc]}<br>`;
        }
        accHtml += `<b>總資產合計：$${totalAsset}</b>`;
        document.getElementById('accountSummaryCard').innerHTML = accHtml;

        // 渲染帳戶管理頁面列表
        document.getElementById('accountListCard').innerHTML = accounts.map(acc => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #333;">
                <span>${acc} (餘額: $${balances[acc]})</span>
                <button onclick="deleteAccount('${acc}')" style="background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">刪除</button>
            </div>
        `).join('');

        // 渲染近期明細
        const listEl = document.getElementById('recordListCard');
        if (records.length === 0) {
            listEl.innerHTML = '尚無記帳記錄';
        } else {
            listEl.innerHTML = records.slice(0, 15).map(r => {
                let desc = r.type === '轉帳' ? `轉帳 (${r.from} ➔ ${r.to})` : `[${r.primary}] ${r.sub} (${r.account})`;
                let amtClass = r.type === '收入' ? 'amount-income' : r.type === '支出' ? 'amount-expense' : 'amount-transfer';
                let sign = r.type === '收入' ? '+' : r.type === '支出' ? '-' : '⇄';
                return `
                    <div class="record-item">
                        <div class="record-info">
                            <div><b>${desc}</b> ${r.note ? '- ' + r.note : ''}</div>
                            <div>${r.date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="record-amount ${amtClass}">${sign}$${r.amount}</span>
                            <button class="del-btn" onclick="deleteRecord(${r.id})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    }

    render();
</script>

</body>
</html>
