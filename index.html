<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質感記帳 App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #f39c12;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --credit-color: #3498db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 70px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 8px;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .nav-tab.active {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2, h3 {
            color: var(--accent-color);
            margin-top: 0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #888;
            cursor: pointer;
            font-weight: bold;
        }
        .type-btn.active.expense { background-color: var(--danger-color); color: white; }
        .type-btn.active.income { background-color: var(--success-color); color: white; }
        .type-btn.active.transfer { background-color: var(--credit-color); color: white; }

        .submit-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .submit-btn:active { opacity: 0.8; }
        .page { display: none; }
        .page.active { display: block; }
        
        .item-row {
            background-color: #2a2a2a;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .expense { color: var(--danger-color); }
        .income { color: var(--success-color); }
        .transfer { color: var(--credit-color); }
        
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .btn-icon {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 4px;
            background-color: #333;
        }
        .btn-icon:hover { color: var(--accent-color); background-color: #444; }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0;
        }
        .cat-option {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        .cat-option.selected {
            border-color: var(--accent-color);
            background-color: rgba(243, 156, 18, 0.15);
        }

        /* 月曆檢視樣式 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .cal-day-name {
            font-size: 0.8rem;
            color: #888;
            padding-bottom: 5px;
        }
        .cal-cell {
            background-color: #2a2a2a;
            padding: 8px 2px;
            border-radius: 6px;
            min-height: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .cal-cell.other-month { opacity: 0.3; }
        .cal-cell.selected { border: 1px solid var(--accent-color); background-color: rgba(243, 156, 18, 0.2); }
        .has-dot {
            width: 4px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* 分析頁面互動區塊 */
        .stat-clickable {
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            padding: 4px;
        }
        .stat-clickable:hover {
            background-color: #2a2a2a;
        }
        .drilldown-list {
            margin: 8px 0 15px 0;
            padding-left: 10px;
            border-left: 2px solid var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部導航列 -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchPage('home', this)">首頁</button>
        <button class="nav-tab" onclick="switchPage('calendar', this)">月曆</button>
        <button class="nav-tab" onclick="switchPage('add', this)">記一筆</button>
        <button class="nav-tab" onclick="switchPage('accounts', this)">帳戶</button>
        <button class="nav-tab" onclick="switchPage('categories', this)">分類</button>
        <button class="nav-tab" onclick="switchPage('charts', this)">分析</button>
    </div>

    <!-- 首頁 -->
    <div id="home" class="page active">
        <div class="card">
            <h2>📊 預算與週期控制</h2>
            <p>本週已花費：<span id="weeklySpent">$0</span></p>
            <p>本週預算剩餘：<span id="weeklyBudgetRemain">$0</span></p>
            <p>本月已花費總額：<span id="monthlySpent">$0</span></p>
            <input type="number" id="budgetInput" placeholder="設定週預算">
            <button class="submit-btn" onclick="updateBudget()">修改週預算</button>
        </div>

        <div class="card">
            <h3>💰 資產與負債總覽</h3>
            <div id="accountListUI"></div>
            <hr style="border: 0; border-top: 1px solid #444; margin: 12px 0;">
            <p><strong>淨資產合計：<span id="netAssets">$0</span></strong></p>
        </div>

        <div class="card">
            <h3>📝 近期記帳明細</h3>
            <ul id="transactionList" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>

    <!-- 月曆檢視頁面 -->
    <div id="calendar" class="page">
        <div class="card">
            <div class="calendar-header">
                <button class="btn-icon" onclick="changeMonth(-1)">◀ 上月</button>
                <h3 id="calMonthTitle" style="margin:0;">2026年9月</h3>
                <button class="btn-icon" onclick="changeMonth(1)">下月 ▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="card" id="dayDetailCard">
            <h3 id="selectedDateTitle">請選擇上方日期</h3>
            <div id="daySummary" style="margin-bottom: 10px; font-size: 0.9rem; color: #aaa;"></div>
            <ul id="dayTransactionList" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>

    <!-- 記一筆 / 編輯共用表單 -->
    <div id="add" class="page">
        <div class="card">
            <h2 id="formTitle">✍️ 新增收支 / 轉帳</h2>
            <input type="hidden" id="editTxId">
            <div class="type-selector">
                <button type="button" class="type-btn active expense" onclick="setTxType('expense')">支出</button>
                <button type="button" class="type-btn income" onclick="setTxType('income')">收入</button>
                <button type="button" class="type-btn transfer" onclick="setTxType('transfer')">轉帳</button>
            </div>

            <label style="font-size:0.85rem; color:#aaa;">日期：</label>
            <input type="date" id="txDate">

            <div id="categorySection">
                <label style="font-size:0.85rem; color:#aaa;">選擇分類：</label>
                <div id="categoryGrid" class="cat-grid"></div>
            </div>

            <div id="accountSection">
                <label style="font-size:0.85rem; color:#aaa;" id="accountLabel">支付帳戶：</label>
                <select id="txAccount"></select>
            </div>

            <div id="toAccountSection" style="display:none;">
                <label style="font-size:0.85rem; color:#aaa;">轉入帳戶：</label>
                <select id="txToAccount"></select>
            </div>

            <label style="font-size:0.85rem; color:#aaa;">金額 (NT$)：</label>
            <input type="number" id="txAmount" placeholder="請輸入金額">

            <label style="font-size:0.85rem; color:#aaa;">備註說明：</label>
            <input type="text" id="txTitle" placeholder="例如：雞腿飯、月薪入帳">

            <button class="submit-btn" id="submitTxBtn" onclick="saveTransaction()">確認新增</button>
        </div>
    </div>

    <!-- 帳戶管理 -->
    <div id="accounts" class="page">
        <div class="card">
            <h2>💳 新增帳戶 / 信用卡</h2>
            <input type="text" id="newAccName" placeholder="例如：現金錢包、CUBE卡">
            <input type="number" id="newAccBalance" placeholder="初始金額 / 額度">
            <select id="newAccType">
                <option value="asset">一般資產 (現金/活存)</option>
                <option value="credit">信用卡 (消費不影響總資產，累積待繳)</option>
            </select>
            <button class="submit-btn" onclick="addNewAccount()">新增帳戶</button>
        </div>
        <div class="card">
            <h3>📂 現有帳戶列表</h3>
            <div id="manageAccountList"></div>
        </div>
    </div>

    <!-- 分類管理 -->
    <div id="categories" class="page">
        <div class="card">
            <h2>🏷️ 新增自訂分類</h2>
            <select id="newCatType">
                <option value="expense">支出分類</option>
                <option value="income">收入分類</option>
            </select>
            <input type="text" id="newCatIcon" placeholder="圖示 (請輸入 Emoji，例如 🍔 🚗)">
            <input type="text" id="newCatName" placeholder="分類名稱，例如：餐飲、交通">
            <button class="submit-btn" onclick="addNewCategory()">新增分類</button>
        </div>
        <div class="card">
            <h3>📂 現有分類列表</h3>
            <div id="manageCategoryList"></div>
        </div>
    </div>

    <!-- 分析統計 -->
    <div id="charts" class="page">
        <div class="card">
            <div class="calendar-header">
                <button class="btn-icon" onclick="changeAnalysisMonth(-1)">◀ 上月</button>
                <h3 id="analysisTitle" style="margin:0;">2026年9月 分析</h3>
                <button class="btn-icon" onclick="changeAnalysisMonth(1)">下月 ▶</button>
            </div>
            <div id="analysisContent" style="margin-top: 15px;"></div>
        </div>
    </div>
</div>

<script>
    let accounts = JSON.parse(localStorage.getItem('my_accounts')) || [
        { id: 'cash', name: '現金錢包', balance: 1000, type: 'asset' },
        { id: 'ctbc', name: '中國信託', balance: 5000, type: 'asset' },
        { id: 'credit_card', name: 'CUBE卡', balance: 0, type: 'credit' }
    ];

    let categories = JSON.parse(localStorage.getItem('my_categories')) || [
        { id: 'food', name: '餐飲', icon: '🍜', type: 'expense' },
        { id: 'transport', name: '交通', icon: '🚗', type: 'expense' },
        { id: 'life', name: '生活', icon: '🏠', type: 'expense' },
        { id: 'shopping', name: '購物', icon: '🛍️', type: 'expense' },
        { id: 'fun', name: '娛樂', icon: '🎉', type: 'expense' },
        { id: 'salary', name: '薪資', icon: '💰', type: 'income' }
    ];

    let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
    let weeklyBudget = localStorage.getItem('my_budget') ? parseFloat(localStorage.getItem('my_budget')) : 3000;

    let currentTxType = 'expense';
    let selectedCategory = categories[0]?.id || '';
    
    let viewDate = new Date();
    let analysisDate = new Date();
    let selectedDateStr = new Date().toISOString().slice(0, 10);
    let drillDownKey = null;

    document.getElementById('txDate').valueAsDate = new Date();

    function switchPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if(btn) btn.classList.add('active');
        renderAll();
    }

    function setTxType(type) {
        currentTxType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active', 'expense', 'income', 'transfer'));
        event.target.classList.add('active', type);

        if (type === 'transfer') {
            document.getElementById('categorySection').style.display = 'none';
            document.getElementById('toAccountSection').style.display = 'block';
            document.getElementById('accountLabel').innerText = '轉出帳戶：';
        } else {
            document.getElementById('categorySection').style.display = 'block';
            document.getElementById('toAccountSection').style.display = 'none';
            document.getElementById('accountLabel').innerText = '支付/收支帳戶：';
            renderCategoryGrid();
        }
    }

    function renderCategoryGrid() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        let filtered = categories.filter(c => c.type === currentTxType);
        if (filtered.length > 0 && !filtered.some(c => c.id === selectedCategory)) {
            selectedCategory = filtered[0].id;
        }
        filtered.forEach(cat => {
            let div = document.createElement('div');
            div.className = `cat-option ${cat.id === selectedCategory ? 'selected' : ''}`;
            div.innerHTML = `${cat.icon} ${cat.name}`;
            div.onclick = () => {
                selectedCategory = cat.id;
                renderCategoryGrid();
            };
            grid.appendChild(div);
        });
    }

    function renderAccountSelectors() {
        let fromSelect = document.getElementById('txAccount');
        let toSelect = document.getElementById('txToAccount');
        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        accounts.forEach(acc => {
            let opt1 = document.createElement('option');
            opt1.value = acc.id;
            opt1.innerText = `${acc.name} (${acc.type === 'credit' ? '待繳: $' + acc.balance : '餘額: $' + acc.balance})`;
            fromSelect.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = acc.id;
            opt2.innerText = acc.name;
            toSelect.appendChild(opt2);
        });
    }

    function saveTransaction() {
        let editId = document.getElementById('editTxId').value;
        let date = document.getElementById('txDate').value;
        let amount = parseFloat(document.getElementById('txAmount').value);
        let title = document.getElementById('txTitle').value.trim() || (currentTxType === 'transfer' ? '帳戶互轉' : '未命名');
        let accountId = document.getElementById('txAccount').value;
        let toAccountId = document.getElementById('txToAccount').value;

        if (isNaN(amount) || amount <= 0) {
            alert('請輸入有效的金額！');
            return;
        }

        if (editId) {
            revertTransactionBalance(parseInt(editId));
            transactions = transactions.filter(t => t.id !== parseInt(editId));
        }

        let acc = accounts.find(a => a.id === accountId);
        if (currentTxType === 'expense') {
            if (acc.type === 'credit') {
                acc.balance += amount;
            } else {
                if (acc.balance < amount) {
                    alert('帳戶餘額不足！');
                    if(editId) renderAll();
                    return;
                }
                acc.balance -= amount;
            }
        } else if (currentTxType === 'income') {
            acc.balance += amount;
        } else if (currentTxType === 'transfer') {
            if (accountId === toAccountId) {
                alert('轉出與轉入帳戶不能相同！');
                return;
            }
            let toAcc = accounts.find(a => a.id === toAccountId);
            if (acc.type !== 'credit' && acc.balance < amount) {
                alert('轉出帳戶餘額不足！');
                return;
            }
            
            if (acc.type === 'credit') acc.balance -= amount;
            else acc.balance -= amount;

            if (toAcc.type === 'credit') {
                toAcc.balance -= amount;
            } else {
                toAcc.balance += amount;
            }
        }

        let tx = {
            id: editId ? parseInt(editId) : Date.now(),
            date,
            amount,
            title,
            type: currentTxType,
            categoryId: currentTxType === 'transfer' ? '' : selectedCategory,
            accountId,
            toAccountId: currentTxType === 'transfer' ? toAccountId : ''
        };

        transactions.push(tx);
        resetForm();
        renderAll();
        alert(editId ? '修改成功！' : '記帳成功！');
        switchPage('home', document.querySelectorAll('.nav-tab')[0]);
    }

    function revertTransactionBalance(id) {
        let t = transactions.find(item => item.id === id);
        if (!t) return;
        let acc = accounts.find(a => a.id === t.accountId);
        if (acc) {
            if (t.type === 'expense') {
                if (acc.type === 'credit') acc.balance -= t.amount;
                else acc.balance += t.amount;
            } else if (t.type === 'income') {
                acc.balance -= t.amount;
            } else if (t.type === 'transfer') {
                if (acc.type === 'credit') acc.balance += t.amount;
                else acc.balance += t.amount;
                let toAcc = accounts.find(a => a.id === t.toAccountId);
                if (toAcc) {
                    if (toAcc.type === 'credit') toAcc.balance += t.amount;
                    else toAcc.balance -= t.amount;
                }
            }
        }
    }

    function editTransaction(id) {
        let t = transactions.find(item => item.id === id);
        if (!t) return;

        switchPage('add', null);
        document.getElementById('formTitle').innerText = '✏️ 修改記帳';
        document.getElementById('submitTxBtn').innerText = '確認修改';
        document.getElementById('editTxId').value = t.id;
        document.getElementById('txDate').value = t.date;
        document.getElementById('txAmount').value = t.amount;
        document.getElementById('txTitle').value = t.title;
        
        currentTxType = t.type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active', 'expense', 'income', 'transfer'));
        if(t.type === 'expense') document.querySelector('.type-btn.expense').classList.add('active', 'expense');
        if(t.type === 'income') document.querySelector('.type-btn.income').classList.add('active', 'income');
        if(t.type === 'transfer') document.querySelector('.type-btn.transfer').classList.add('active', 'transfer');

        if(t.type === 'transfer') {
            document.getElementById('categorySection').style.display = 'none';
            document.getElementById('toAccountSection').style.display = 'block';
            document.getElementById('txAccount').value = t.accountId;
            document.getElementById('txToAccount').value = t.toAccountId;
        } else {
            document.getElementById('categorySection').style.display = 'block';
            document.getElementById('toAccountSection').style.display = 'none';
            selectedCategory = t.categoryId;
            renderCategoryGrid();
            document.getElementById('txAccount').value = t.accountId;
        }
    }

    function resetForm() {
        document.getElementById('formTitle').innerText = '✍️ 新增收支 / 轉帳';
        document.getElementById('submitTxBtn').innerText = '確認新增';
        document.getElementById('editTxId').value = '';
        document.getElementById('txAmount').value = '';
        document.getElementById('txTitle').value = '';
        document.getElementById('txDate').valueAsDate = new Date();
    }

    function deleteTransaction(id) {
        if (confirm('確定要刪除這筆紀錄嗎？')) {
            revertTransactionBalance(id);
            transactions = transactions.filter(t => t.id !== id);
            renderAll();
        }
    }

    function addNewAccount() {
        let name = document.getElementById('newAccName').value.trim();
        let balance = parseFloat(document.getElementById('newAccBalance').value) || 0;
        let type = document.getElementById('newAccType').value;

        if (!name) { alert('請輸入帳戶名稱！'); return; }
        accounts.push({ id: 'acc_' + Date.now(), name, balance, type });
        renderAll();
        document.getElementById('newAccName').value = '';
        document.getElementById('newAccBalance').value = '';
        alert('帳戶新增成功！');
    }

    // 修改帳戶餘額功能
    function editAccountBalance(id) {
        let acc = accounts.find(a => a.id === id);
        if (!acc) return;
        let newBal = prompt(`請輸入「${acc.name}」的最新正確金額：`, acc.balance);
        if (newBal !== null) {
            let parsed = parseFloat(newBal);
            if (!isNaN(parsed)) {
                acc.balance = parsed;
                renderAll();
                alert('帳戶金額已更新！');
            } else {
                alert('請輸入有效的數字！');
            }
        }
    }

    function deleteAccount(id) {
        if (accounts.length <= 1) { alert('至少需要保留一個帳戶！'); return; }
        accounts = accounts.filter(a => a.id !== id);
        renderAll();
    }

    function addNewCategory() {
        let type = document.getElementById('newCatType').value;
        let icon = document.getElementById('newCatIcon').value.trim() || '🏷️';
        let name = document.getElementById('newCatName').value.trim();

        if (!name) { alert('請輸入分類名稱！'); return; }
        categories.push({ id: 'cat_' + Date.now(), name, icon, type });
        renderAll();
        document.getElementById('newCatName').value = '';
        document.getElementById('newCatIcon').value = '';
        alert('分類新增成功！');
    }

    function deleteCategory(id) {
        if (categories.length <= 1) { alert('至少需要保留一個分類！'); return; }
        categories = categories.filter(c => c.id !== id);
        renderAll();
    }

    function updateBudget() {
        let val = parseFloat(document.getElementById('budgetInput').value);
        if (!isNaN(val) && val >= 0) {
            weeklyBudget = val;
            localStorage.setItem('my_budget', weeklyBudget);
            renderAll();
            alert('週預算已更新！');
        }
    }

    function changeMonth(direction) {
        viewDate.setMonth(viewDate.getMonth() + direction);
        renderCalendar();
    }

    function changeAnalysisMonth(direction) {
        analysisDate.setMonth(analysisDate.getMonth() + direction);
        drillDownKey = null;
        renderAnalysis();
    }

    function toggleDrillDown(key) {
        drillDownKey = (drillDownKey === key) ? null : key;
        renderAnalysis();
    }

    function renderCalendar() {
        let year = viewDate.getFullYear();
        let month = viewDate.getMonth();
        document.getElementById('calMonthTitle').innerText = `${year}年${month + 1}月`;

        let grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        ['日', '一', '二', '三', '四', '五', '六'].forEach(d => {
            let div = document.createElement('div');
            div.className = 'cal-day-name';
            div.innerText = d;
            grid.appendChild(div);
        });

        let firstDayIndex = new Date(year, month, 1).getDay();
        let totalDays = new Date(year, month + 1, 0).getDate();
        let prevTotalDays = new Date(year, month, 0).getDate();

        for (let i = firstDayIndex - 1; i >= 0; i--) {
            let dayNum = prevTotalDays - i;
            let cell = document.createElement('div');
            cell.className = 'cal-cell other-month';
            cell.innerHTML = `<span>${dayNum}</span>`;
            grid.appendChild(cell);
        }

        for (let i = 1; i <= totalDays; i++) {
            let mStr = String(month + 1).padStart(2, '0');
            let dStr = String(i).padStart(2, '0');
            let dateStr = `${year}-${mStr}-${dStr}`;

            let cell = document.createElement('div');
            cell.className = `cal-cell ${dateStr === selectedDateStr ? 'selected' : ''}`;
            
            let hasExpense = transactions.some(t => t.date === dateStr && t.type === 'expense');

            cell.innerHTML = `<span>${i}</span>${hasExpense ? '<div class="has-dot"></div>' : ''}`;
            cell.onclick = () => {
                selectedDateStr = dateStr;
                renderCalendar();
                renderDayDetail();
            };
            grid.appendChild(cell);
        }
        renderDayDetail();
    }

    function renderDayDetail() {
        let titleEl = document.getElementById('selectedDateTitle');
        let summaryEl = document.getElementById('daySummary');
        let listEl = document.getElementById('dayTransactionList');

        titleEl.innerText = `${selectedDateStr} 明細`;
        listEl.innerHTML = '';

        let dayTxs = transactions.filter(t => t.date === selectedDateStr);
        let dayExpense = dayTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        let dayIncome = dayTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);

        summaryEl.innerHTML = `總額: <span class="expense">-$${dayExpense}</span> | 收入: <span class="income">+$${dayIncome}</span>`;

        if (dayTxs.length === 0) {
            listEl.innerHTML = '<li style="color:#888; text-align:center; padding:10px;">這天沒有記帳紀錄</li>';
            return;
        }

        dayTxs.forEach(t => {
            let cat = categories.find(c => c.id === t.categoryId) || { name: '其他', icon: '🔄' };
            let acc = accounts.find(a => a.id === t.accountId) || { name: '' };

            let li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = `
                <div>
                    <strong>${cat.icon} ${t.title}</strong><br>
                    <small style="color:#888">[${acc.name}]</small>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="${t.type}">${t.type === 'expense' ? '-' : t.type === 'income' ? '+' : '🔄'}${t.amount}</span>
                    <div class="action-btns">
                        <button class="btn-icon" onclick="editTransaction(${t.id})">✏️</button>
                        <button class="btn-icon" onclick="deleteTransaction(${t.id})">×</button>
                    </div>
                </div>
            `;
            listEl.appendChild(li);
        });
    }

    function renderAnalysis() {
        let year = analysisDate.getFullYear();
        let month = analysisDate.getMonth();
        let monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
        
        document.getElementById('analysisTitle').innerText = `${year}年${month + 1}月 分析`;

        let monthTxs = transactions.filter(t => t.date.startsWith(monthPrefix));
        let totalExpense = monthTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        let totalIncome = monthTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);

        let catStats = {};
        monthTxs.filter(t => t.type === 'expense').forEach(t => {
            catStats[t.categoryId] = (catStats[t.categoryId] || 0) + t.amount;
        });

        let accStats = {};
        monthTxs.filter(t => t.type === 'expense' || t.type === 'transfer').forEach(t => {
            accStats[t.accountId] = (accStats[t.accountId] || 0) + t.amount;
        });

        let contentEl = document.getElementById('analysisContent');
        let html = `
            <p>💰 本月總支出：<strong class="expense">-$${totalExpense}</strong></p>
            <p>💵 本月總收入：<strong class="income">+$${totalIncome}</strong></p>
            <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
            <h4 style="color:var(--accent-color); margin-bottom:10px;">🏷️ 分類支出佔比 (點擊查看細項)</h4>
        `;

        if (totalExpense === 0) {
            html += '<p style="color:#888; text-align:center; margin-bottom:15px;">這個月沒有支出紀錄</p>';
        } else {
            let sortedCats = Object.keys(catStats).sort((a, b) => catStats[b] - catStats[a]);
            sortedCats.forEach(catId => {
                let cat = categories.find(c => c.id === catId) || { name: '其他', icon: '🔄' };
                let amount = catStats[catId];
                let percent = Math.round((amount / totalExpense) * 100);
                let isExpanded = (drillDownKey === 'cat_' + catId);

                html += `
                    <div class="stat-clickable" onclick="toggleDrillDown('cat_${catId}')">
                        <div class="stat-bar-container">
                            <div class="stat-bar-info">
                                <span>${cat.icon} ${cat.name} ▾</span>
                                <span>$${amount} (${percent}%)</span>
                            </div>
                            <div class="stat-bar-bg">
                                <div class="stat-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                        </div>
                    </div>
                `;

                if (isExpanded) {
                    let subTxs = monthTxs.filter(t => t.categoryId === catId && t.type === 'expense');
                    html += `<div class="drilldown-list">`;
                    if(subTxs.length === 0) {
                        html += `<p style="color:#888; font-size:0.85rem; margin:5px 0;">無明細紀錄</p>`;
                    } else {
                        subTxs.forEach(st => {
                            let acc = accounts.find(a => a.id === st.accountId) || { name: '' };
                            html += `<div style="display:flex; justify-content:between; font-size:0.85rem; margin:4px 0; color:#ccc;">
                                <span>${st.date.slice(5)} - ${st.title} [${acc.name}]</span>
                                <span class="expense">-$${st.amount}</span>
                            </div>`;
                        });
                    }
                    html += `</div>`;
                }
            });
        }

        html += `
            <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
            <h4 style="color:var(--accent-color); margin-bottom:10px;">💳 各帳戶本月開銷 (點擊查看細項)</h4>
        `;

        let sortedAccs = Object.keys(accStats).sort((a, b) => accStats[b] - accStats[a]);
        if (sortedAccs.length === 0) {
            html += '<p style="color:#888; text-align:center;">這個月沒有帳戶支出或轉帳紀錄</p>';
        } else {
            sortedAccs.forEach(accId => {
                let acc = accounts.find(a => a.id === accId) || { name: '未知帳戶', type: 'asset' };
                let amount = accStats[accId];
                let accPercent = totalExpense > 0 ? Math.min(100, Math.round((amount / totalExpense) * 100)) : 0;
                let isExpanded = (drillDownKey === 'acc_' + accId);

                html += `
                    <div class="stat-clickable" onclick="toggleDrillDown('acc_${accId}')">
                        <div class="stat-bar-container">
                            <div class="stat-bar-info">
                                <span>💳 ${acc.name} ▾</span>
                                <span class="expense">-$${amount}</span>
                            </div>
                            <div class="stat-bar-bg">
                                <div class="stat-bar-fill" style="width: ${accPercent}%; background-color: var(--credit-color);"></div>
                            </div>
                        </div>
                    </div>
                `;

                if (isExpanded) {
                    let subTxs = monthTxs.filter(t => t.accountId === accId && (t.type === 'expense' || t.type === 'transfer'));
                    html += `<div class="drilldown-list">`;
                    if(subTxs.length === 0) {
                        html += `<p style="color:#888; font-size:0.85rem; margin:5px 0;">無明細紀錄</p>`;
                    } else {
                        subTxs.forEach(st => {
                            let cat = categories.find(c => c.id === st.categoryId) || { name: '轉帳', icon: '🔄' };
                            html += `<div style="display:flex; justify-content:between; font-size:0.85rem; margin:4px 0; color:#ccc;">
                                <span>${st.date.slice(5)} - ${cat.icon} ${st.title}</span>
                                <span class="${st.type === 'expense' ? 'expense' : 'transfer'}">-$${st.amount}</span>
                            </div>`;
                        });
                    }
                    html += `</div>`;
                }
            });
        }

        contentEl.innerHTML = html;
    }

    function renderAll() {
        localStorage.setItem('my_accounts', JSON.stringify(accounts));
        localStorage.setItem('my_categories', JSON.stringify(categories));
        localStorage.setItem('my_transactions', JSON.stringify(transactions));
        localStorage.setItem('my_budget', weeklyBudget);

        renderAccountSelectors();
        renderCategoryGrid();
        renderCalendar();
        renderAnalysis();

        let manageCat = document.getElementById('manageCategoryList');
        manageCat.innerHTML = '';
        categories.forEach(cat => {
            let div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `<span>${cat.icon} [${cat.type === 'expense' ? '支出' : '收入'}] ${cat.name}</span>
                             <button class="btn-icon" onclick="deleteCategory('${cat.id}')">刪除</button>`;
            manageCat.appendChild(div);
        });

        let now = new Date();
        let dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
        let monday = new Date(now);
        monday.setDate(now.getDate() - dayOfWeek + 1);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        
        let mondayStr = monday.toISOString().slice(0, 10);
        let sundayStr = sunday.toISOString().slice(0, 10);
        let currentMonthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        let weeklySpent = 0;
        let monthlySpent = 0;

        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = '';

        transactions.slice().reverse().forEach(t => {
            if (t.type === 'expense') {
                if (t.date >= mondayStr && t.date <= sundayStr) {
                    weeklySpent += t.amount;
                }
                if (t.date.startsWith(currentMonthPrefix)) {
                    monthlySpent += t.amount;
                }
            }

            if(listEl.children.length < 10) {
                let cat = categories.find(c => c.id === t.categoryId) || { name: '其他', icon: '🔄' };
                let acc = accounts.find(a => a.id === t.accountId) || { name: '' };

                let li = document.createElement('li');
                li.className = 'item-row';
                li.innerHTML = `
                    <div>
                        <strong>${cat.icon} ${t.title}</strong><br>
                        <small style="color:#888">${t.date} | [${acc.name}]</small>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="${t.type}">${t.type === 'expense' ? '-' : t.type === 'income' ? '+' : '🔄'}${t.amount}</span>
                        <div class="action-btns">
                            <button class="btn-icon" onclick="editTransaction(${t.id})">✏️</button>
                            <button class="btn-icon" onclick="deleteTransaction(${t.id})">×</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(li);
            }
        });

        document.getElementById('weeklySpent').innerText = '$' + weeklySpent;
        document.getElementById('weeklyBudgetRemain').innerText = '$' + Math.max(0, weeklyBudget - weeklySpent);
        document.getElementById('monthlySpent').innerText = '$' + monthlySpent;
        document.getElementById('budgetInput').value = weeklyBudget;

        let netAssets = 0;
        let totalDebt = 0;
        let accListUI = document.getElementById('accountListUI');
        accListUI.innerHTML = '';

        accounts.forEach(acc => {
            let p = document.createElement('p');
            if (acc.type === 'credit') {
                totalDebt += acc.balance;
                p.style.color = 'var(--credit-color)';
                p.innerHTML = `${acc.name} (信用卡待繳)：$${acc.balance}`;
            } else {
                netAssets += acc.balance;
                p.innerHTML = `${acc.name}：$${acc.balance}`;
            }
            accListUI.appendChild(p);
        });
        document.getElementById('netAssets').innerText = '$' + (netAssets - totalDebt);

        // 帳戶管理清單（新增修改金額與刪除按鈕）
        let manageAcc = document.getElementById('manageAccountList');
        manageAcc.innerHTML = '';
        accounts.forEach(acc => {
            let div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `
                <span>${acc.name} (${acc.type === 'credit' ? '信用卡' : '資產'})：$${acc.balance}</span>
                <div class="action-btns">
                    <button class="btn-icon" onclick="editAccountBalance('${acc.id}')">修改</button>
                    <button class="btn-icon" onclick="deleteAccount('${acc.id}')" style="color:var(--danger-color);">刪除</button>
                </div>
            `;
            manageAcc.appendChild(div);
        });
    }

    renderAll();
<script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
   } 
</script>

</body>
