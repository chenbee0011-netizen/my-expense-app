<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的質感記帳 App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2c2c2c;
            --text-main: #e0e0e0;
            --text-sub: #888888;
            --accent-gold: #f39c12;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: var(--text-main); }
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 70px; }
        
        /* 底部/頂部頁籤選單 */
        .tabs { display: flex; justify-content: space-around; background: var(--card-bg); border-radius: 12px; padding: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); position: sticky; top: 10px; z-index: 100; }
        .tab-btn { background: none; border: none; color: var(--text-sub); font-size: 0.9rem; font-weight: bold; cursor: pointer; padding: 8px 10px; border-radius: 8px; }
        .tab-btn.active { background: var(--accent-gold); color: #000; }

        .section { display: none; }
        .section.active { display: block; }

        h2 { font-size: 1.1rem; border-left: 4px solid var(--accent-gold); padding-left: 8px; margin-top: 20px; color: var(--text-main); }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 16px; border-radius: 12px; margin-bottom: 15px; line-height: 1.6; }
        
        label { display: block; margin-top: 12px; font-size: 0.9rem; font-weight: bold; color: var(--text-sub); }
        input, select { width: 100%; padding: 12px; margin-top: 6px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 1rem; color: #fff; }
        
        .type-selector { display: flex; gap: 10px; margin-top: 5px; }
        .type-btn { flex: 1; padding: 10px; border: 1px solid #444; background: #2a2a2a; color: var(--text-sub); border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
        .type-btn.active.expense { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
        .type-btn.active.income { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        .type-btn.active.transfer { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        button.submit-btn { background: var(--accent-gold); color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button.submit-btn:active { opacity: 0.8; }

        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--card-border); font-size: 0.95rem; }
        .record-info div:last-child { font-size: 0.8rem; color: var(--text-sub); margin-top: 3px; }
        .record-amount { font-weight: bold; }
        .amount-expense { color: var(--accent-red); }
        .amount-income { color: var(--accent-green); }
        .amount-transfer { color: var(--accent-blue); }

        .del-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 0.9rem; padding: 5px; }
        .flex-row { display: flex; gap: 10px; }
        .budget-input-group { display: flex; gap: 10px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部頁籤 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁</button>
        <button class="tab-btn" onclick="switchTab('add')">記一筆</button>
        <button class="tab-btn" onclick="switchTab('accounts')">帳戶</button>
        <button class="tab-btn" onclick="switchTab('charts')">圖表</button>
    </div>

    <!-- 1. 首頁與預算控制台 -->
    <div id="home" class="section active">
        <h2>📊 本週預算控制台</h2>
        <div class="card" id="budgetCard">載入中...</div>

        <h2>💰 帳戶資產總覽</h2>
        <div class="card" id="accountSummaryCard">載入中...</div>

        <h2>📝 近期記帳明細</h2>
        <div class="card" id="recordListCard">載入中...</div>
    </div>

    <!-- 2. 記帳輸入頁面 -->
    <div id="add" class="section">
        <h2>✍️ 新增收支 / 轉帳</h2>
        <div class="card">
            <label>記帳類型：</label>
            <div class="type-selector">
                <div class="type-btn active expense" onclick="setType('支出')">支出</div>
                <div class="type-btn income" onclick="setType('收入')">收入</div>
                <div class="type-btn transfer" onclick="setType('轉帳')">轉帳</div>
            </div>

            <label>日期：</label>
            <input type="date" id="date">

            <!-- 支出分類 -->
            <div id="expenseCategoryGroup">
                <label>支出一級分類：</label>
                <select id="expensePrimary">
                    <option value="餐飲">餐飲</option>
                    <option value="交通">交通</option>
                    <option value="生活">生活</option>
                    <option value="購物">購物</option>
                    <option value="娛樂">娛樂</option>
                    <option value="儲蓄">儲蓄</option>
                </select>
                <label>二級消費細項：</label>
                <input type="text" id="expenseSub" placeholder="例如：早餐、午餐、咖啡、手搖飲">
            </div>

            <!-- 收入分類 -->
            <div id="incomeCategoryGroup" style="display:none;">
                <label>收入分類：</label>
                <select id="incomeCategory">
                    <option value="薪資">薪資</option>
                    <option value="獎金">獎金</option>
                    <option value="投資">投資</option>
                    <option value="利息">利息</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <!-- 轉帳群組 -->
            <div id="transferGroup" style="display:none;">
                <label>轉出帳戶：</label>
                <select id="fromAccount"></select>
                <label>轉入帳戶：</label>
                <select id="toAccount"></select>
            </div>

            <!-- 一般收支帳戶 -->
            <div id="accountGroup">
                <label>支付/收支帳戶：</label>
                <select id="account"></select>
            </div>

            <label>金額 (NT$)：</label>
            <input type="number" id="amount" placeholder="請輸入金額">

            <label>備註說明：</label>
            <input type="text" id="note" placeholder="例如：雞腿飯、月薪入帳">

            <button class="submit-btn" onclick="addRecord()">確認儲存</button>
        </div>
    </div>

    <!-- 3. 帳戶管理頁面 (自訂名稱與初始金額) -->
    <div id="accounts" class="section">
        <h2>💳 新增帳戶</h2>
        <div class="card">
            <label>帳戶名稱：</label>
            <input type="text" id="newAccountName" placeholder="例如：現金錢包、國泰世華">
            <label>初始金額 (NT$)：</label>
            <input type="number" id="newAccountInitial" placeholder="例如：1000">
            <button onclick="addAccount()" class="submit-btn" style="margin-top:15px;">新增帳戶</button>
        </div>
        <h2>現有帳戶列表與資產</h2>
        <div class="card" id="accountListCard">載入中...</div>
    </div>

    <!-- 4. 圖表統計分頁 -->
    <div id="charts" class="section">
        <h2>📈 本週開銷統計</h2>
        <div class="card" id="weekChartCard">載入中...</div>

        <h2>📅 每月開銷統計</h2>
        <div class="card" id="monthChartCard">載入中...</div>
    </div>
</div>

<script>
    // 初始化資料
    let records = JSON.parse(localStorage.getItem('app_records')) || [];
    let accounts = JSON.parse(localStorage.getItem('app_accounts')) || [
        { name: "現金錢包", initial: 1000 },
        { name: "中國信託", initial: 5000 },
        { name: "國泰世華", initial: 10000 }
    ];
    let weeklyBudget = Number(localStorage.getItem('app_weekly_budget')) || 3000;
    let currentType = "支出";

    document.getElementById('date').valueAsDate = new Date();

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        render();
    }

    function setType(type) {
        currentType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active', 'expense', 'income', 'transfer'));
        const btn = event.target;
        btn.classList.add('active', type === '支出' ? 'expense' : type === '收入' ? 'income' : 'transfer');

        document.getElementById('expenseCategoryGroup').style.display = (type === '支出') ? 'block' : 'none';
        document.getElementById('incomeCategoryGroup').style.display = (type === '收入') ? 'block' : 'none';
        document.getElementById('transferGroup').style.display = (type === '轉帳') ? 'block' : 'none';
        document.getElementById('accountGroup').style.display = (type === '轉帳') ? 'none' : 'block';
    }

    function updateBudget() {
        const val = Number(document.getElementById('budgetInput').value);
        if (val > 0) {
            weeklyBudget = val;
            localStorage.setItem('app_weekly_budget', weeklyBudget);
            render();
            alert('本週預算已更新！');
        } else {
            alert('請輸入有效的預算金額！');
        }
    }

    function addAccount() {
        const name = document.getElementById('newAccountName').value.trim();
        const initial = Number(document.getElementById('newAccountInitial').value) || 0;
        
        if (name && !accounts.some(a => a.name === name)) {
            accounts.push({ name, initial });
            localStorage.setItem('app_accounts', JSON.stringify(accounts));
            document.getElementById('newAccountName').value = '';
            document.getElementById('newAccountInitial').value = '';
            render();
            alert('帳戶新增成功！');
        } else {
            alert('請輸入有效或未重複的帳戶名稱。');
        }
    }

    function deleteAccount(name) {
        if (accounts.length <= 1) {
            alert('至少需要保留一個帳戶！');
            return;
        }
        accounts = accounts.filter(a => a.name !== name);
        localStorage.setItem('app_accounts', JSON.stringify(accounts));
        render();
    }

    function addRecord() {
        const date = document.getElementById('date').value;
        const amount = Number(document.getElementById('amount').value);
        const note = document.getElementById('note').value;

        if (!date || !amount) {
            alert('請完整填寫日期與金額！');
            return;
        }

        let newRecord = { id: Date.now(), type: currentType, date, amount, note };

        if (currentType === '轉帳') {
            newRecord.from = document.getElementById('fromAccount').value;
            newRecord.to = document.getElementById('toAccount').value;
            if (newRecord.from === newRecord.to) {
                alert('轉出與轉入帳戶不能相同！');
                return;
            }
        } else if (currentType === '收入') {
            newRecord.category = document.getElementById('incomeCategory').value;
            newRecord.account = document.getElementById('account').value;
        } else {
            newRecord.primary = document.getElementById('expensePrimary').value;
            newRecord.sub = document.getElementById('expenseSub').value || '一般';
            newRecord.account = document.getElementById('account').value;
        }

        records.push(newRecord);
        localStorage.setItem('app_records', JSON.stringify(records));
        
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        document.getElementById('expenseSub').value = '';
        switchTab('home');
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
    }

    function deleteRecord(id) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('app_records', JSON.stringify(records));
        render();
    }

    function render() {
        // 更新下拉選單
        const accNames = accounts.map(a => a.name);
        ['account', 'fromAccount', 'toAccount'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = accNames.map(acc => `<option value="${acc}">${acc}</option>`).join('');
            }
        });

        // 計算各帳戶餘額 (初始金額 + 收入 - 支出 ± 轉帳)
        let balances = {};
        accounts.forEach(a => balances[a.name] = a.initial);

        let totalExpense = 0;
        let todayExpense = 0;
        const todayStr = new Date().toISOString().split('T')[0];

        const now = new Date();
        const dayOfWeek = now.getDay() || 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - dayOfWeek + 1);
        const mondayStr = monday.toISOString().split('T')[0];

        records.sort((a, b) => new Date(b.date) - new Date(a.date));

        records.forEach(r => {
            if (r.type === '收入') {
                if (balances[r.account] !== undefined) balances[r.account] += r.amount;
            } else if (r.type === '支出') {
                if (balances[r.account] !== undefined) balances[r.account] -= r.amount;
                if (r.date === todayStr) todayExpense += r.amount;
                if (r.date >= mondayStr) totalExpense += r.amount;
            } else if (r.type === '轉帳') {
                if (balances[r.from] !== undefined) balances[r.from] -= r.amount;
                if (balances[r.to] !== undefined) balances[r.to] += r.amount;
            }
        });

        // 1. 渲染預算控制台 (可更改)
        let remaining = weeklyBudget - totalExpense;
        document.getElementById('budgetCard').innerHTML = `
            本週已花費總額：$${totalExpense}<br>
            <b>本週預算剩餘：$${remaining}</b><br>
            今日已花費：$${todayExpense}<br>
            <div class="budget-input-group">
                <input type="number" id="budgetInput" value="${weeklyBudget}" style="padding:8px;">
                <button onclick="updateBudget()" style="background:var(--accent-gold); border:none; border-radius:8px; font-weight:bold; padding:0 15px; cursor:pointer;">修改預算</button>
            </div>
        `;

        // 2. 渲染帳戶資產總覽
        let totalAsset = 0;
        let accHtml = '';
        accounts.forEach(a => {
            let bal = balances[a.name] || 0;
            totalAsset += bal;
            accHtml += `${a.name} (初始 $${a.initial})：<b>$${bal}</b><br>`;
        });
        accHtml += `<br><b>總資產合計：$${totalAsset}</b>`;
        document.getElementById('accountSummaryCard').innerHTML = accHtml;

        // 3. 渲染帳戶管理頁面清單
        document.getElementById('accountListCard').innerHTML = accounts.map(a => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #333;">
                <div><b>${a.name}</b><br><span style="font-size:0.8rem; color:var(--text-sub);">初始金額: $${a.initial} | 目前餘額: $${balances[a.name]}</span></div>
                <button onclick="deleteAccount('${a.name}')" style="background:#e74c3c; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">刪除</button>
            </div>
        `).join('');

        // 4. 渲染近期明細
        const listEl = document.getElementById('recordListCard');
        if (records.length === 0) {
            listEl.innerHTML = '尚無記帳記錄';
        } else {
            listEl.innerHTML = records.slice(0, 15).map(r => {
                let desc = r.type === '轉帳' ? `轉帳 (${r.from} ➔ ${r.to})` : r.type === '收入' ? `[收入] ${r.category} (${r.account})` : `[${r.primary}] ${r.sub} (${r.account})`;
                let amtClass = r.type === '收入' ? 'amount-income' : r.type === '支出' ? 'amount-expense' : 'amount-transfer';
                let sign = r.type === '收入' ? '+' : r.type === '支出' ? '-' : '⇄';
                return `
                    <div class="record-item">
                        <div class="record-info">
                            <div><b>${desc}</b> ${r.note ? '- ' + r.note : ''}</div>
                            <div>${r.date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="record-amount ${amtClass}">${sign}$${r.amount}</span>
                            <button class="del-btn" onclick="deleteRecord(${r.id})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 5. 渲染圖表分頁 (週與月統計)
        let weekCategories = {};
        let monthCategories = {};
        let weekTotal = 0;
        let monthTotal = 0;

        const currentMonthStr = new Date().toISOString().slice(0, 7); // YYYY-MM

        records.forEach(r => {
            if (r.type === '支出') {
                // 本週統計
                if (r.date >= mondayStr) {
                    weekTotal += r.amount;
                    weekCategories[r.primary] = (weekCategories[r.primary] || 0) + r.amount;
                }
                // 本月統計
                if (r.date.startsWith(currentMonthStr)) {
                    monthTotal += r.amount;
                    monthCategories[r.primary] = (monthCategories[r.primary] || 0) + r.amount;
                }
            }
        });

        let weekHtml = `本週總支出：<b>$${weekTotal}</b><br><hr style="border-color:#333; margin:10px 0;">`;
        for (let cat in weekCategories) {
            let pct = weekTotal > 0 ? ((weekCategories[cat] / weekTotal) * 100).toFixed(1) : 0;
            weekHtml += `${cat}: $${weekCategories[cat]} (${pct}%)<br>`;
        }
        if (weekTotal === 0) weekHtml += '本週尚無支出記錄';
        document.getElementById('weekChartCard').innerHTML = weekHtml;

        let monthHtml = `本月 (${currentMonthStr}) 總支出：<b>$${monthTotal}</b><br><hr style="border-color:#333; margin:10px 0;">`;
        for (let cat in monthCategories) {
            let pct = monthTotal > 0 ? ((monthCategories[cat] / monthTotal) * 100).toFixed(1) : 0;
            monthHtml += `${cat}: $${monthCategories[cat]} (${pct}%)<br>`;
        }
        if (monthTotal === 0) monthHtml += '本月尚無支出記錄';
        document.getElementById('monthChartCard').innerHTML = monthHtml;
    }

    render();
</script>

</body>
</html>
