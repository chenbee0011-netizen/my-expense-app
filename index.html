<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的純文字記帳 App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-size: 1.2rem; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; color: #007bff; }
        .card { background: #e9ecef; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95rem; line-height: 1.6; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
        button:active { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        th { background: #f8f9fa; }
        .del-btn { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 本週預算控制台</h2>
    <div class="card" id="budgetCard">
        載入中...
    </div>

    <h2>💰 帳戶餘額總覽</h2>
    <div class="card" id="accountCard">
        載入中...
    </div>

    <h2>✍️ 新增記帳</h2>
    <form id="expenseForm">
        <label>日期：</label>
        <input type="date" id="date" required>

        <label>時段分類：</label>
        <select id="category">
            <option value="早餐">早餐</option>
            <option value="午餐">午餐</option>
            <option value="晚餐">晚餐</option>
            <option value="其他">其他</option>
            <option value="儲蓄">儲蓄</option>
        </select>

        <label>消費細項：</label>
        <input type="text" id="item" placeholder="例如：雞腿飯、咖啡" required>

        <label>金額 (NT$)：</label>
        <input type="number" id="amount" placeholder="例如：110" required>

        <label>支付帳戶：</label>
        <select id="account">
            <option value="現金錢包">現金錢包</option>
            <option value="中國信託">中國信託</option>
            <option value="國泰世華">國泰世華</option>
        </select>

        <button type="submit">新增記錄</button>
    </form>

    <h2>📈 記帳明細與統計</h2>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>分類</th>
                    <th>細項</th>
                    <th>金額</th>
                    <th>帳戶</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordList"></tbody>
        </table>
    </div>
</div>

<script>
    // 初始化本地資料
    let records = JSON.parse(localStorage.getItem('my_expenses')) || [];
    let weeklyBudget = Number(localStorage.getItem('my_weekly_budget')) || 3000;

    const form = document.getElementById('expenseForm');
    const recordList = document.getElementById('recordList');
    const budgetCard = document.getElementById('budgetCard');
    const accountCard = document.getElementById('accountCard');

    // 預設日期為今天
    document.getElementById('date').valueAsDate = new Date();

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const newRecord = {
            id: Date.now(),
            date: document.getElementById('date').value,
            category: document.getElementById('category').value,
            item: document.getElementById('item').value,
            amount: Number(document.getElementById('amount').value),
            account: document.getElementById('account').value
        };
        records.push(newRecord);
        saveAndRender();
        form.reset();
        document.getElementById('date').valueAsDate = new Date();
    });

    function deleteRecord(id) {
        records = records.filter(r => r.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('my_expenses', JSON.stringify(records));
        render();
    }

    function render() {
        recordList.innerHTML = '';
        let totalExpense = 0;
        let todayExpense = 0;
        
        // 帳戶餘額初始化
        let balances = { "現金錢包": 0, "中國信託": 0, "國泰世華": 0 };

        const todayStr = new Date().toISOString().split('T')[0];

        // 簡單計算本週範圍 (假設週一到週日)
        const now = new Date();
        const dayOfWeek = now.getDay() || 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - dayOfWeek + 1);
        const mondayStr = monday.toISOString().split('T')[0];

        records.sort((a, b) => new Date(b.date) - new Date(a.date));

        records.forEach(r => {
            // 計算帳戶餘額 (如果是儲蓄或一般消費，視為支出扣款；若未來擴充收入可依需求調整，目前預設所有記帳為支出)
            if (balances[r.account] !== undefined) {
                balances[r.account] -= r.amount;
            }

            // 計算今日花費
            if (r.date === todayStr) {
                todayExpense += r.amount;
            }

            // 計算本週花費
            if (r.date >= mondayStr) {
                totalExpense += r.amount;
            }

            // 渲染表格
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.date}</td>
                <td>${r.category}</td>
                <td>${r.item}</td>
                <td>$${r.amount}</td>
                <td>${r.account}</td>
                <td><button class="del-btn" onclick="deleteRecord(${r.id})">刪</button></td>
            `;
            recordList.appendChild(tr);
        });

        // 渲染預算控制台
        let remaining = weeklyBudget - totalExpense;
        budgetCard.innerHTML = `
            本週總預算上限：$${weeklyBudget}<br>
            本週已花費總額：$${totalExpense}<br>
            <b>本週預算剩餘：$${remaining}</b><br>
            今日已花費：$${todayExpense}
        `;

        // 渲染帳戶總覽
        accountCard.innerHTML = `
            現金錢包餘額：$${balances["現金錢包"]}<br>
            中國信託餘額：$${balances["中國信託"]}<br>
            國泰世華餘額：$${balances["國泰世華"]}<br>
            <b>總資產合計：$${balances["現金錢包"] + balances["中國信託"] + balances["國泰世華"]}</b>
        `;
    }

    render();
</script>

</body>
</html>
