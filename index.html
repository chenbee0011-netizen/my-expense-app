<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質感記帳 App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #f39c12;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        /* 模擬計算機輸入框樣式 */
        .calc-display {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: var(--text-color);
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: right;
            letter-spacing: 1px;
            min-height: 25px;
            word-break: break-all;
        }
        /* 計算機鍵盤樣式 */
        .calc-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .calc-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:active {
            background-color: #555;
        }
        .calc-btn.operator {
            background-color: #d35400;
        }
        .calc-btn.equals {
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
        }
        .calc-btn.clear {
            background-color: var(--danger-color);
        }

        button.submit-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }
        button.submit-btn:active {
            opacity: 0.8;
        }
        .transaction-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .transaction-item {
            background-color: #2a2a2a;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .expense { color: var(--danger-color); }
        .income { color: var(--success-color); }
        .delete-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 質感記帳</h1>

    <!-- 記帳輸入卡片 -->
    <div class="card">
        <input type="text" id="title" placeholder="項目名稱 (例如: 午餐)">
        
        <!-- 計算機顯示列 -->
        <div id="calcDisplay" class="calc-display">0</div>
        
        <!-- 計算機鍵盤 -->
        <div class="calc-keypad">
            <button class="calc-btn clear" onclick="calcClear()">C</button>
            <button class="calc-btn" onclick="calcAppend('7')">7</button>
            <button class="calc-btn" onclick="calcAppend('8')">8</button>
            <button class="calc-btn" onclick="calcAppend('9')">9</button>
            
            <button class="calc-btn operator" onclick="calcAppend('+')">+</button>
            <button class="calc-btn" onclick="calcAppend('4')">4</button>
            <button class="calc-btn" onclick="calcAppend('5')">5</button>
            <button class="calc-btn" onclick="calcAppend('6')">6</button>
            
            <button class="calc-btn operator" onclick="calcAppend('-')">-</button>
            <button class="calc-btn" onclick="calcAppend('1')">1</button>
            <button class="calc-btn" onclick="calcAppend('2')">2</button>
            <button class="calc-btn" onclick="calcAppend('3')">3</button>
            
            <button class="calc-btn equals" onclick="calcResult()">=</button>
            <button class="calc-btn" onclick="calcAppend('0')">0</button>
            <button class="calc-btn" onclick="calcAppend('.')">.</button>
            <button class="calc-btn" onclick="calcBackSpace()">⌫</button>
        </div>

        <select id="type">
            <option value="expense">支出 (-)</option>
            <option value="income">收入 (+)</option>
        </select>

        <button class="submit-btn" onclick="addTransaction()">新增紀錄</button>
    </div>

    <!-- 紀錄列表卡片 -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1.1rem; color:#aaa;">近期明細</h3>
        <ul id="transactionList" class="transaction-list">
            <!-- 動態生成 -->
        </ul>
    </div>
</div>

<script>
    let currentExpression = "0";

    function updateDisplay() {
        document.getElementById('calcDisplay').innerText = currentExpression;
    }

    function calcAppend(val) {
        if (currentExpression === "0" && val !== '.') {
            currentExpression = val;
        } else {
            currentExpression += val;
        }
        updateDisplay();
    }

    function calcClear() {
        currentExpression = "0";
        updateDisplay();
    }

    function calcBackSpace() {
        if (currentExpression.length > 1) {
            currentExpression = currentExpression.slice(0, -1);
        } else {
            currentExpression = "0";
        }
        updateDisplay();
    }

    function calcResult() {
        try {
            // 使用 eval 安全計算加減算式
            let result = eval(currentExpression);
            if (isNaN(result) || !isFinite(result)) {
                currentExpression = "錯誤";
            } else {
                currentExpression = String(result);
            }
        } catch (error) {
            currentExpression = "錯誤";
        }
        updateDisplay();
    }

    // 讀取本地儲存的記帳資料
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    function addTransaction() {
        // 先自動計算當前算式當作最終金額
        calcResult();
        let amount = parseFloat(currentExpression);
        let title = document.getElementById('title').value.trim();
        let type = document.getElementById('type').value;

        if (!title || isNaN(amount) || amount <= 0) {
            alert('請輸入有效的項目名稱與金額！');
            return;
        }

        const transaction = {
            id: Date.now(),
            title: title,
            amount: amount,
            type: type
        };

        transactions.push(transaction);
        saveAndRender();

        // 清空輸入
        document.getElementById('title').value = '';
        calcClear();
    }

    function deleteTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = '';

        transactions.slice().reverse().forEach(t => {
            const li = document.createElement('li');
            li.className = 'transaction-item';
            li.innerHTML = `
                <span>${t.title}</span>
                <span class="${t.type}">
                    ${t.type === 'expense' ? '-' : '+'}$${t.amount}
                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">×</button>
                </span>
            `;
            listEl.appendChild(li);
        });
    }

    // 初始化載入
    saveAndRender();
</script>

</body>
</html>
